<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f0f1e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="StreamPoll Remote Control — manage your live polls from your phone">
  <title>StreamPoll Remote</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Inline critical icon SVG as favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='20' width='100' height='100' fill='%236c63ff'/><text x='50' y='68' text-anchor='middle' font-size='50' fill='white'>📊</text></svg>">
</head>
<body>
  <!-- ===== PIN ENTRY SCREEN ===== -->
  <div id="screen-pin" class="screen active">
    <div class="pin-container">
      <div class="brand">
        <div class="brand-icon">
          <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
            <rect x="2" y="2" width="52" height="52" rx="14" stroke="url(#brandGrad)" stroke-width="3" fill="rgba(108,99,255,0.1)"/>
            <rect x="12" y="32" width="8" height="14" rx="2" fill="#6c63ff" opacity="0.6"/>
            <rect x="24" y="22" width="8" height="24" rx="2" fill="#a78bfa"/>
            <rect x="36" y="16" width="8" height="30" rx="2" fill="#6c63ff"/>
            <defs>
              <linearGradient id="brandGrad" x1="0" y1="0" x2="56" y2="56">
                <stop offset="0%" stop-color="#6c63ff"/>
                <stop offset="100%" stop-color="#a78bfa"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="brand-title">StreamPoll</h1>
        <p class="brand-subtitle">Remote Control</p>
      </div>

      <div class="pin-display">
        <div class="pin-dots">
          <div class="pin-dot" data-index="0"></div>
          <div class="pin-dot" data-index="1"></div>
          <div class="pin-dot" data-index="2"></div>
          <div class="pin-dot" data-index="3"></div>
        </div>
        <p class="pin-label" id="pin-message">Enter PIN to connect</p>
      </div>

      <div class="keypad">
        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <button class="key key-empty" disabled></button>
        <button class="key" data-key="0">0</button>
        <button class="key key-delete" data-key="delete" aria-label="Delete">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
            <line x1="18" y1="9" x2="12" y2="15"/>
            <line x1="12" y1="9" x2="18" y2="15"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ===== MAIN DASHBOARD ===== -->
  <div id="screen-dashboard" class="screen">
    <!-- Status Bar -->
    <header class="status-bar">
      <div class="status-left">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">Connected</span>
      </div>
      <div class="status-right">
        <span class="ws-badge" id="ws-badge" title="Restream connection">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 1l22 22"/>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
            <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <line x1="12" y1="20" x2="12.01" y2="20"/>
          </svg>
        </span>
        <button class="disconnect-btn" id="btn-disconnect" aria-label="Disconnect">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Sub-navigation Tabs -->
    <div class="dashboard-tabs">
      <button class="dash-tab active" data-tab="poll">📊 Active</button>
      <button class="dash-tab" data-tab="library">📚 Library</button>
      <button class="dash-tab" data-tab="queue">📈 Queue</button>
    </div>

    <!-- Poll Content -->
    <main class="dashboard-content">
      <!-- Panel 1: Active Poll -->
      <div id="panel-poll" class="dash-panel active">
        <!-- No Poll State -->
        <div id="no-poll" class="no-poll-card glass-card">
          <div class="no-poll-icon">📊</div>
          <h2>No Active Poll</h2>
          <p>Waiting for a poll to be loaded...</p>
        </div>

        <!-- Active Poll -->
        <div id="active-poll" class="poll-section" style="display:none;">
          <div class="poll-header glass-card">
            <div class="poll-status-row">
              <span class="poll-status-badge" id="poll-status-badge">IDLE</span>
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="poll-total-votes" id="poll-total-votes">0 votes</span>
                <button class="edit-poll-btn" id="btn-edit-poll" aria-label="Edit Poll">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                  </svg>
                </button>
              </div>
            </div>
            <h2 class="poll-question" id="poll-question">Loading question...</h2>
          </div>

          <div class="poll-options" id="poll-options">
            <!-- Options rendered by JS -->
          </div>
        </div>
      </div>

      <!-- Panel 2: Library -->
      <div id="panel-library" class="dash-panel" style="display:none;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h2 style="font-size:16px;margin:0;">Poll Library</h2>
          <button class="create-poll-btn-lib" id="btn-create-poll-lib">＋ Create Poll</button>
        </div>
        <div class="library-list" id="library-list">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Panel 3: Queue -->
      <div id="panel-queue" class="dash-panel" style="display:none;">
        <h2 style="font-size:16px;margin-bottom:12px;">Active Queue</h2>
        <div class="queue-list" id="queue-list">
          <!-- Populated by JS -->
        </div>
      </div>
    </main>

    <!-- ===== POLL EDITOR MODAL ===== -->
    <div id="editor-overlay" class="overlay" style="display:none;">
      <div class="editor-panel glass-card">
        <div class="editor-header">
          <h3>Edit Poll</h3>
          <button class="editor-close-btn" id="btn-editor-close" aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <div class="editor-body">
          <div class="editor-field">
            <label class="editor-label">Poll Name (Optional, for saving)</label>
            <input type="text" id="editor-name" class="editor-input" placeholder="e.g. Winner Poll" autocomplete="off" />
          </div>

          <div class="editor-field">
            <label class="editor-label">Question</label>
            <input type="text" id="editor-question" class="editor-input" placeholder="What do you think?" autocomplete="off" />
          </div>

          <div class="editor-field">
            <label class="editor-label">Options</label>
            <div id="editor-options-list" class="editor-options-list">
              <!-- Populated by JS -->
            </div>
            <button class="editor-add-btn" id="btn-editor-add-option">
              <span>＋</span> Add Option
            </button>
          </div>
        </div>

        <div class="editor-footer-buttons">
          <button class="editor-cancel-btn" id="btn-editor-cancel">Cancel</button>
          <button class="editor-save-btn btn-apply" id="btn-editor-apply">Apply Now</button>
          <button class="editor-save-btn btn-save-lib" id="btn-editor-save-lib">Save to Lib</button>
          <button class="editor-save-btn btn-save-queue" id="btn-editor-save-queue">Save & Queue</button>
        </div>
      </div>
    </div>

    <!-- Control Buttons -->
    <nav class="controls-bar" id="controls-bar">
      <button class="ctrl-btn ctrl-start" id="btn-start" data-action="start_poll">
        <span class="ctrl-icon">▶</span>
        <span class="ctrl-label">Start</span>
      </button>
      <button class="ctrl-btn ctrl-pause" id="btn-pause" data-action="pause_poll">
        <span class="ctrl-icon">⏸</span>
        <span class="ctrl-label">Pause</span>
      </button>
      <button class="ctrl-btn ctrl-resume" id="btn-resume" data-action="resume_poll" style="display:none;">
        <span class="ctrl-icon">▶</span>
        <span class="ctrl-label">Resume</span>
      </button>
      <button class="ctrl-btn ctrl-stop" id="btn-stop" data-action="stop_poll">
        <span class="ctrl-icon">⏹</span>
        <span class="ctrl-label">Stop</span>
      </button>
      <button class="ctrl-btn ctrl-reset" id="btn-reset" data-action="reset_poll">
        <span class="ctrl-icon">↺</span>
        <span class="ctrl-label">Reset</span>
      </button>
      <button class="ctrl-btn ctrl-next" id="btn-next" data-action="next_poll">
        <span class="ctrl-icon">⏭</span>
        <span class="ctrl-label">Next</span>
      </button>
    </nav>
  </div>

  <!-- ===== RECONNECTING OVERLAY ===== -->
  <div id="overlay-reconnect" class="overlay" style="display:none;">
    <div class="overlay-content glass-card">
      <div class="spinner"></div>
      <h3>Connection Lost</h3>
      <p id="reconnect-message">Reconnecting...</p>
      <button class="overlay-btn" id="btn-retry">Retry Now</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
